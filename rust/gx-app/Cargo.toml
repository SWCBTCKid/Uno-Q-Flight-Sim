[package]
name = "gx-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# JSBSim backend for `gx-app s2` (links libgx_fdm.so: board/AArch64 builds
# only, see tools/build_m1_s2.ps1).
jsbsim = ["gx-sim/jsbsim"]

[dependencies]
gx-input = { path = "../gx-input" }
gx-render = { path = "../gx-render" }
gx-sim = { path = "../gx-sim" }
gx-world = { path = "../gx-world" }
libc = "0.2"
