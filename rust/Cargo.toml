[workspace]
resolver = "2"
members = [
    "gx-fdm-sys",
    "gx-fdm",
    "gx-geo",
    "gx-app",
    "gx-input",
    "gx-render",
    "gx-sim",
    "gx-world",
    "m1-fdm-bench",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "GPL-2.0-or-later"
publish = false

[profile.release]
opt-level = 3
debug = false
lto = false
codegen-units = 16
panic = "unwind"
